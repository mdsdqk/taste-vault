    <!--
      DIRECTION CONTRACT — TasteVault Portal (Library + Reference detail)
      seed d8706055 · mode operate · form: "The Connoisseur's Gallery" (grounded #1 of 7)

      THESIS: Browsing your own taste is wandering a gallery you hung, not scanning a
      feed. Refuses the masonry-grid-plus-filter-sidebar of every reference tool: the
      wall is a left-to-right hang where a piece you mean more hangs larger.

      OWN-WORLD: Riso/silkscreen print. Cool punchy palette — SLATE (light) / NOIR
      (dark); green = liked, red = disliked, cobalt accent, cyan highlight; grain
      overlay. Screenshots are pinned plates: printed keyline, a real pushpin, a
      soft cast shadow, a paper mat, a degree of tilt. Young Serif display, Spectral
      note, Spline Sans Mono labels. Rules and ink, never boxes.

      STORY: The visitor recognises a piece, opens it, reads why it was saved
      (the User Note leads), and pins or amends one without a gate.

      FIRST VIEWPORT: "TasteVault" set large in Young Serif; a one-line standfirst;
      the filter/sort band (All / Liked / Disliked, kind, tags, search); then the
      wall — pinned plates at rating-driven sizes, tilted, hung at staggered
      heights. Primary action (open a piece) is the plate itself; "＋ Pin a
      reference" sits in the band.

      FORM: grounded candidate 1 of 7, assigned by the roll and user-pinned.

      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, DESIGN.md, and every shipping raster carrying its
      provenance.
    -->
